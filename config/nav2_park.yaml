bt_navigator:
  ros__parameters:
    enable_stamped_cmd_vel: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: platform/odom/filtered
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    enable_stamped_cmd_vel: true
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    use_realtime_priority: false
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    general_goal_checker:
      # Pose-based SimpleGoalChecker demanded a final heading; with default
      # goal yaw 0 (= North in park) that forced a 180 deg reversal MPPI
      # performs as forward arcs, dragging the robot ~4.4 m off the latched
      # goal before success. PositionGoalChecker ignores orientation — the
      # robot just stops at the waypoint.
      stateful: true
      plugin: "nav2_controller::PositionGoalChecker"
      xy_goal_tolerance: 0.25
    FollowPath:
      # Stock Clearpath MPPI. The earlier shim + 30x600 sample reduction were
      # workarounds for symptoms actually caused by the spawn-relative IMU yaw
      # bug (fixed 2026-08-26) and are reverted so obstacle avoidance behaves
      # as stock.
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 56
      model_dt: 0.05
      batch_size: 2000
      ax_max: 3.0
      ax_min: -3.0
      ay_max: 3.0
      az_max: 3.5
      vx_std: 0.2
      vy_std: 0.2
      wz_std: 0.4
      vx_max: 0.5
      vx_min: -0.35
      vy_max: 0.5
      wz_max: 1.9
      iteration_count: 1
      prune_distance: 1.7
      transform_tolerance: 0.1
      temperature: 0.3
      gamma: 0.015
      motion_model: "DiffDrive"
      visualize: true
      regenerate_noises: true
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      AckermannConstraints:
        min_turning_r: 0.2
      critics: [
        "ConstraintCritic", "CostCritic", "GoalCritic",
        "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic",
        "PathAngleCritic", "PreferForwardCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        trajectory_point_step: 2
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 0

local_costmap:
  local_costmap:
    ros__parameters:
      enable_stamped_cmd_vel: true
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.06
      footprint: "[ [0.55, 0.45], [0.55, -0.45], [-0.55, -0.45], [-0.55, 0.45] ]"
      always_send_full_costmap: true
      plugins: ["static_layer", "voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0
        inflation_radius: 0.8
      # Absolute topic, deliberately. A costmap layer resolves a relative
      # observation-source name inside the costmap sub-node, so "sensors/..."
      # bound to /a200_0000/local_costmap/sensors/lidar2d_0/scan - zero
      # publishers, no scans ever marked. Same trap as gotcha #31.
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: true
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /a200_0000/sensors/lidar2d_0/scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          # 2026-08-27: raised from the stock indoor 3.0/2.5 to match the
          # sensor - the 2D lidar reports range_max 25.0, range_min 0.05,
          # FOV +/-135 deg. Mark at 20 m, below range_max, so max-range
          # no-return readings are not treated as hits; clear at 25 m,
          # >= the marking range, since the eraser must reach at least as
          # far as the marker. Kept identical to the global obstacle_layer.
          raytrace_max_range: 25.0
          raytrace_min_range: 0.0
          obstacle_max_range: 20.0
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
        map_topic: "/a200_0000/map"

global_costmap:
  global_costmap:
    ros__parameters:
      enable_stamped_cmd_vel: true
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      footprint: "[ [0.55, 0.45], [0.55, -0.45], [-0.55, -0.45], [-0.55, 0.45] ]"
      resolution: 0.05
      track_unknown_space: true
      always_send_full_costmap: true
      rolling_window: false
      width: 110
      height: 60
      origin_x: -55.0
      origin_y: -31.55
      # The global costmap carries a live obstacle layer, matching stock nav2
      # and Clearpath: prior map (maps/park_map.pgm) + live scan +
      # inflation. Decision 2026-08-27 - this SUPERSEDES the earlier
      # same-day "static global costmap" decision, which removed the sensor
      # layer. Consequence: the planner now learns obstacles absent from the
      # prior map (the 15 arbol4 trees are excluded from it by design, gotcha
      # #28, as is anything spawned at runtime) and replans around them, rather
      # than planning straight through and leaving all avoidance to the local
      # costmap + MPPI.
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      # Absolute topic, deliberately - same trap as the local costmap's
      # voxel_layer above. A relative "sensors/..." resolves inside the costmap
      # sub-node (/a200_0000/global_costmap/sensors/lidar2d_0/scan), binds to
      # zero publishers, and the layer silently never marks (gotcha #36).
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /a200_0000/sensors/lidar2d_0/scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          # 2026-08-27: raised from the stock indoor 3.0/2.5 to match the
          # sensor - the 2D lidar reports range_max 25.0, range_min 0.05,
          # FOV +/-135 deg. Mark at 20 m, below range_max, so max-range
          # no-return readings are not treated as hits; clear at 25 m,
          # >= the marking range, since the eraser must reach at least as
          # far as the marker.
          #
          # This matters here more than on the local costmap: this one is
          # rolling_window false, 110x60 m, fixed in the map frame, so no
          # cell ever scrolls out of it and raytrace clearing is the ONLY
          # removal mechanism. At the stock 3.0 m a lethal cell could never
          # be cleared once the robot was more than 3 m away, so transient
          # obstacles persisted permanently. The local costmap escapes this
          # because its 5x5 m rolling window discards cells as the robot
          # moves. Measured: with a box 6.0 m dead ahead of a stationary
          # robot in clear line of sight, this costmap read 0 lethal cells;
          # it only marked at 2.15 m range (0 -> 371 lethal, max cost 100).
          #
          # Known risk (gotcha #30): a ray past the terrain edge returns max
          # range, which the costmap reads as free and actively clears, so
          # 25 m clearing is far more aggressive over the void beyond the
          # boundary than 3.0 m was. The keepout filter that used to
          # assert the boundary was removed 2026-08-31; off-terrain goals
          # are rejected by tools/nav_goal.py instead.
          raytrace_max_range: 25.0
          raytrace_min_range: 0.0
          obstacle_max_range: 20.0
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
        map_topic: "/a200_0000/map"
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0
        inflation_radius: 0.8

planner_server:
  ros__parameters:
    enable_stamped_cmd_vel: true
    # expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

# smoother_server and docking_server are deliberately absent: launch/park_stock.launch.py
# does not launch them (nor route_server), so their parameters would never be read.
# Note velocity_smoother below is a DIFFERENT node and IS launched.

behavior_server:
  ros__parameters:
    enable_stamped_cmd_vel: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"
    global_frame: map
    local_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.1
    enable_stamped_cmd_vel: true
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.2
    rotational_acc_lim: 0.5


waypoint_follower:
  ros__parameters:
    enable_stamped_cmd_vel: true
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    enable_stamped_cmd_vel: true
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [1.0, 0.0, 1.0]
    min_velocity: [-1.0, 0.0, -1.0]
    max_accel: [1.0, 0.0, 1.0]
    max_decel: [-1.0, 0.0, -1.0]
    odom_topic: "platform/odom/filtered"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

collision_monitor:
  ros__parameters:
    enable_stamped_cmd_vel: true
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    # collision_monitor is back in the command path (Clearpath stock wiring).
    # It was bypassed while the 2D lidar swept a full 360 deg: it saw the robot's
    # own sensor arch at ~0.40 m, inside the footprint, and read it as a
    # permanent imminent collision, scaling every nav2 command to zero. Fixed at
    # the source - the lidar now sweeps +-135 deg (robot_configs/robot_*.yaml).
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: True
    stop_pub_timeout: 2.0
    # Polygons represent zone around the robot for "stop", "slowdown" and "limit" action types,
    # and robot footprint for "approach" action type.
    polygons: ["FootprintApproach"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "local_costmap/published_footprint"
      time_before_collision: 0.3
      simulation_time_step: 0.1
      min_points: 12
      visualize: False
      enabled: True
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "sensors/lidar2d_0/scan"
      min_height: 0.15
      max_height: 2.0
      enabled: True
