# config/costmap_filter_info.yaml
#
# Serves the terrain keepout mask to nav2's KeepoutFilter.
#
# park has no ground plane: a lidar ray past the terrain edge returns max
# range, which the costmap reads as evidence of free space and clears. The
# void cannot be sensed, so it is asserted here instead.
a200_0000:
  costmap_filter_info_server:
    ros__parameters:
      use_sim_time: true
      type: 0                          # 0 = keepout / preferred lanes
      filter_info_topic: "/a200_0000/costmap_filter_info"
      mask_topic: "/a200_0000/keepout_filter_mask"
      base: 0.0
      multiplier: 1.0

  filter_mask_server:
    ros__parameters:
      use_sim_time: true
      frame_id: "map"
      topic_name: "/a200_0000/keepout_filter_mask"
      yaml_filename: "/home/thinhpham/Documents/Husky_viz/maps/park_keepout.yaml"

  map_server:
    ros__parameters:
      use_sim_time: true
      frame_id: "map"
      topic_name: "/a200_0000/map"
      yaml_filename: "/home/thinhpham/Documents/Husky_viz/maps/park_map.yaml"
