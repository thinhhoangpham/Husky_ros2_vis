# config/gps_localization.yaml
#
# Global localization: map -> odom only.
#
# The Clearpath-generated ekf_node (~/clearpath/platform/config/localization.yaml)
# keeps sole ownership of odom -> base_link and is never edited - it is
# regenerated by apply_config.sh at every launch.
#
# The local EKF (Clearpath-generated) fuses wheel odometry + IMU: it owns
# odom -> base_link and is the dead-reckoning fallback. This global EKF
# fuses GPS position + IMU heading (yaw + yaw rate only here, not raw
# acceleration - see the comment above imu0 below) and deliberately does
# NOT fuse wheel odometry.
#
# The two EKFs read DIFFERENT IMUs, deliberately. Stock imu_0 declares no
# <orientation_reference_frame>, so gz-sim references its orientation to the
# sensor's INITIAL pose - measured yaw 0.0000 at world yaw 149.72 deg in park.
# That is harmless for the local EKF, whose odom frame is itself spawn-relative,
# and it keeps sole ownership of odom -> base_link on stock imu_0.
# This global EKF cannot use it: it fuses yaw as an ABSOLUTE map-frame heading,
# so a spawn-relative yaw put a constant -149.7 deg rotation into map -> odom -
# the confirmed cause of nav2 driving away from valid paths. It therefore reads
# the ENU-referenced imu_enu (urdf/imu_enu.urdf.xacro), rotated ENU -> map by
# tools/imu_map_relay.py.
a200_0000:
  navsat_transform_node:
    ros__parameters:
      use_sim_time: true
      frequency: 30.0
      delay: 0.0
      # Local ENU tangent plane, not UTM: UTM's 500 km false easting puts
      # coordinates where float32 costmap arithmetic loses centimetres.
      use_local_cartesian: true
      # Pinned so the map origin is identical every run regardless of spawn.
      # Matches worlds/park.sdf and the park_1.bag dataset.
      wait_for_datum: true
      datum: [49.9, 8.9, 0.0]
      # park has no Magnetometer, so heading comes from IMU orientation.
      magnetic_declination_radians: 0.0
      # 1.5708 = +pi/2, kept - but the original justification for it was
      # wrong and is corrected here. It claimed "IMU yaw is in the world
      # frame"; measurement disproved that (stock imu_0 reports yaw 0.0000 at
      # world yaw 149.72 deg - it is referenced to the spawn pose, not the
      # world). This node now reads the RAW ENU-referenced imu_enu topic
      # instead, which is what navsat_transform expects. Measured in park:
      # ENU yaw 59.73 deg at world yaw 149.72 deg, i.e. ENU yaw =
      # world yaw - pi/2 (park.sdf declares heading_deg 90). navsat_transform
      # adds yaw_offset to the ENU yaw it is given, so +pi/2 is exactly the
      # ENU -> world/map mapping. Do NOT point this at sensors/imu_map/data:
      # that topic has the +pi/2 already applied and would double-count it.
      yaw_offset: 1.5708
      use_odometry_yaw: false
      zero_altitude: true
      publish_filtered_gps: true
      broadcast_utm_transform: false
      transform_timeout: 0.1

  ekf_node_map:
    ros__parameters:
      use_sim_time: true
      # 10.0, not 30.0 (controller ruling, Task 4 fix session): map -> odom
      # correction is driven by 1 Hz GPS, so 30 Hz buys nothing and only
      # costs missed deadlines on this machine, which is measurably CPU
      # starved while gz sim runs (load average 13.96, gz sim >100% CPU,
      # this node logging "Failed to meet update rate" at 30 Hz). 10 Hz is
      # still 10x the GPS rate. Do not restore to 30 without re-measuring
      # CPU headroom first.
      frequency: 10.0
      two_d_mode: true               # park is flat to 3.5 mm
      publish_tf: true
      print_diagnostics: true
      map_frame: map
      odom_frame: odom
      base_link_frame: base_link
      world_frame: map               # <- publishes map -> odom

      # No odom0 here, deliberately: wheel odometry is NOT fused into this
      # global EKF. Measured 2026-08-26 on a logged nav2 goal - skid-steer
      # wheel odometry over-counted distance by 46% in the curved final
      # approach (2.99 m truth vs 4.36 m odom), which ran this EKF 0.65 m
      # ahead of truth and made the goal checker fire 0.95 m early. GPS
      # (odom1 below) is the position source in the map frame by design.

      # imu0 restored (Task 4 fix session 4): dropping it entirely (fix
      # session 3) was a contaminated experiment - it was tried while
      # launch/gps_localization.launch.py still wired navsat_transform_node
      # to the LOCAL filter's odom-frame output, creating a positive
      # feedback loop that manufactured apparent velocity regardless of
      # what was fused here. With that wiring bug fixed, imu0 is back with
      # the round-2 amendment kept: yaw (index 5) and yaw rate (index 11)
      # true, ax (index 12) false. ax stays out - odom0 is velocity-only, so
      # nothing pins absolute x,y between 1 Hz GPS fixes, and
      # double-integrating accelerometer noise over that gap was a real,
      # independent divergence source seen in fix session 1.
      # sensors/imu_map/data, not sensors/imu_0/data: imu_map_relay's
      # world/map-referenced yaw (see the header comment). imu0_config is
      # unchanged - yaw (index 5) and yaw rate (index 11).
      imu0: sensors/imu_map/data
      imu0_config: [false, false, false,
                    false, false, true,
                    false, false, false,
                    false, false, true,
                    false, false, false]
      imu0_differential: false
      imu0_queue_size: 10
      imu0_remove_gravitational_acceleration: true

      odom1: odometry/gps            # from navsat_transform_node
      odom1_config: [true,  true,  false,
                     false, false, false,
                     false, false, false,
                     false, false, false,
                     false, false, false]
      odom1_differential: false
      odom1_queue_size: 10
