# config/gps_localization.yaml
#
# Global localization: map -> odom only.
#
# The Clearpath-generated ekf_node (~/clearpath/platform/config/localization.yaml)
# keeps sole ownership of odom -> base_link and is never edited - it is
# regenerated by apply_config.sh at every launch.
#
# The local EKF (Clearpath-generated) fuses wheel odometry + IMU: it owns
# odom -> base_link and is the dead-reckoning fallback. This global EKF
# fuses GPS position + IMU heading (yaw + yaw rate only here, not raw
# acceleration - see the comment above imu0 below) and deliberately does
# NOT fuse wheel odometry.
#
# Both EKFs fuse an IMU; this one reads imu_enu (urdf/imu_enu.urdf.xacro),
# which declares an ENU orientation reference frame. worlds/park.sdf is now
# heading_deg 0, so the Gazebo world frame IS the ENU frame and imu_enu's
# orientation is already a map-frame heading - no rotation relay is involved.
# Stock imu_0 cannot be used here: it declares no
# <orientation_reference_frame>, so gz-sim references it to the sensor's
# INITIAL pose (measured yaw 0.0000 at world yaw 149.72 deg in park). That is
# harmless for the local EKF, whose odom frame is itself spawn-relative, but
# this filter fuses yaw as an ABSOLUTE map-frame heading.
a200_0000:
  navsat_transform_node:
    ros__parameters:
      use_sim_time: true
      frequency: 30.0
      delay: 3.0
      # Local ENU tangent plane, not UTM: UTM's 500 km false easting puts
      # coordinates where float32 costmap arithmetic loses centimetres.
      use_local_cartesian: true
      # Pinned so the map origin is identical every run regardless of spawn.
      # Matches worlds/park.sdf and the park_1.bag dataset. This is the one
      # deliberate divergence from the Nav2 reference, which uses no datum:
      # this stack plans on a static prior map rather than a rolling costmap,
      # so the map origin must be fixed rather than wherever the first fix lands.
      wait_for_datum: true
      datum: [49.9, 8.9, 0.0]
      # 0.0 because no magnetometer is fused here. park.sdf does load the
      # Magnetometer system plugin, but robot_default.yaml declares no compass
      # sensor - and with use_odometry_yaw true below, heading comes from the
      # global EKF's own output rather than from any magnetic source.
      magnetic_declination_radians: 0.0
      # yaw_offset 0.0 + use_odometry_yaw true match the Nav2 reference
      # (nav2_gps_waypoint_follower_demo/config/dual_ekf_navsat_params.yaml):
      # heading comes from the global EKF's own filtered output, so no IMU
      # subscription and no rotation are needed. delay 3.0 ships with
      # use_odometry_yaw to let that yaw settle before GPS conversion starts.
      yaw_offset: 0.0
      use_odometry_yaw: true
      zero_altitude: true
      publish_filtered_gps: true
      broadcast_utm_transform: false
      transform_timeout: 0.1

  ekf_node_map:
    ros__parameters:
      use_sim_time: true
      # 50 Hz matches the ROS 1 reference; the earlier 10 Hz ruling predates
      # the measurement that the filter lags 0.9 m at motion onset -
      # re-measure CPU only if "Failed to meet update rate" errors become
      # continuous.
      frequency: 50.0
      two_d_mode: true               # park is flat to 3.5 mm
      predict_to_current_time: true
      publish_tf: true
      print_diagnostics: true
      map_frame: map
      odom_frame: odom
      base_link_frame: base_link
      world_frame: map               # <- publishes map -> odom

      # Wheel odometry is fused as VELOCITY ONLY, never position - that is
      # how the ROS 1 reference localization_map.yaml does it and how this
      # file always did. It was briefly removed entirely on 2026-08-26,
      # which left the filter with no velocity source and made it lag 0.9 m
      # behind raw GPS at motion onset - worse than the sensor. Measured
      # 2026-08-26 on a logged nav2 goal - skid-steer wheel odometry
      # over-counted distance by 46% in the curved final approach (2.99 m
      # truth vs 4.36 m odom), which is why it must never supply position:
      # only vx, vy, vyaw (index 6,7,11) are fused here (two_d_mode is true
      # so vz is excluded). GPS (odom1 below) remains the sole position
      # source in the map frame.
      odom0: platform/odom
      odom0_config: [false, false, false,
                     false, false, false,
                     true,  true,  false,
                     false, false, true,
                     false, false, false]
      odom0_differential: false
      odom0_queue_size: 10

      # imu0 supplies absolute map-frame yaw (index 5) and yaw rate (index
      # 11), matching the Nav2 reference's ekf_filter_node_map. ax (index 12)
      # stays false: odom0 is velocity-only, so nothing pins absolute x,y
      # between GPS fixes and double-integrating accelerometer noise over that
      # gap was a measured divergence source.
      # sensors/imu_enu/data, not sensors/imu_0/data: imu_enu is ENU-referenced
      # and park.sdf is heading_deg 0, so its yaw is already a map heading.
      imu0: sensors/imu_enu/data
      imu0_config: [false, false, false,
                    false, false, true,
                    false, false, false,
                    false, false, true,
                    false, false, false]
      imu0_differential: false
      imu0_queue_size: 10
      imu0_remove_gravitational_acceleration: true

      # robot_localization loads odomN inputs by consecutive index starting
      # at 0 and silently stops at the first gap - odom0 above is wheel
      # velocity, so GPS must be odom1 (a gap here means it would never be
      # read; diagnostics would show "Neither X nor its velocity is being
      # measured").
      odom1: odometry/gps            # from navsat_transform_node
      odom1_config: [true,  true,  false,
                     false, false, false,
                     false, false, false,
                     false, false, false,
                     false, false, false]
      odom1_differential: false
      odom1_queue_size: 10

      # Rejects navsat_transform's first, wrong-origin odometry/gps message.
      #
      # navsat_transform converts fixes through a GeographicLib::LocalCartesian
      # whose origin is only established by setTransformGps()'s Reset()
      # (navsat_transform.cpp:955). With wait_for_datum true that is reached
      # only via setManualDatum(), which computeTransform() gates on
      # has_transform_odom_ (:264) and which runs only from the 30 Hz timer -
      # but the timer is created AFTER the `delay` sleep (:234) while the
      # subscriptions are created BEFORE it (:198,:202). So the sleep queues a
      # fix (KeepLast(1)) that gpsFixCallback (:729) converts against an
      # un-Reset origin of lat0=lon0=0 the instant spinning begins, and
      # applying the datum does not clear gps_updated_ - so prepareGpsOdometry
      # (:895) publishes that stale pose as the very first odometry/gps.
      # Measured live: the datum's Reset lands 33 ms after "Delay elapsed",
      # one tick too late, and the published pose was (636893.98, 4855650.27).
      # That is not UTM (zone 32N of the datum is 492818.44, 5527517.14); it is
      # the ENU offset from lat0=lon0=0 to the datum, (636846.49, 4855632.00),
      # plus the robot's own ~45.6 m spawn offset - which is what identifies
      # the un-Reset origin as the cause. Fusing it moved map -> odom by
      # 4,897,662 m and took the filter ~11 s to walk back.
      #
      # 1000.0 sits in a wide, measured gap. R is floored to 1e-9 (ekf.cpp:145)
      # because the sim GPS reports all-zero covariance, so the Mahalanobis
      # denominator is P alone. At the outlier P_xx is ~0.2 m^2 (1e-9 initial,
      # grown by the default Q_xx 0.05 m^2/s over the ~3.35 s the filter ran on
      # odom0/imu0 alone), i.e. sigma ~0.45 m:
      #   the 4,897,662 m outlier is ~1.1e7 sigmas - rejected by 4 orders
      #   the legitimate ~45.6 m first jump to the spawn is ~101 sigmas, so a
      #     threshold of 5 or 10 would reject it too and wedge the filter at
      #     the origin; 1000 admits it once P exceeds 0.0021 m^2, ~0.04 s of
      #     prediction, so the next real fix (2 Hz) lands it
      #   settled P_xx is 7.056e-3 m^2 (measured on odometry/filtered), sigma
      #     0.084 m, so 1000 sigmas is 84 m against a largest settled step of
      #     0.0277 m - it never fires in normal operation
      # Rejection is applied here because initialized_ is a whole-filter flag
      # (filter_base.cpp:206,:248) already set by odom0/imu0, so this first
      # ABSOLUTE position still goes through correct() and its threshold test;
      # it is not treated as the initialising measurement. A failed test leaves
      # state_ and the covariance untouched (ekf.cpp:191-203), so the bad
      # transform is never published rather than published and walked back.
      # The default is double::max(), i.e. no rejection (ros_filter.cpp:1235).
      odom1_pose_rejection_threshold: 1000.0
