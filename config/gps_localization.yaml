# config/gps_localization.yaml
#
# Global localization: map -> odom only.
#
# The Clearpath-generated ekf_node (~/clearpath/platform/config/localization.yaml)
# keeps sole ownership of odom -> base_link and is never edited - it is
# regenerated by apply_config.sh at every launch.
#
# Both EKFs fuse wheel odometry and IMU (yaw + yaw rate only here, not
# raw acceleration - see the comment above imu0 below). Only this one also
# fuses GPS.
a200_0000:
  navsat_transform_node:
    ros__parameters:
      use_sim_time: true
      frequency: 30.0
      delay: 0.0
      # Local ENU tangent plane, not UTM: UTM's 500 km false easting puts
      # coordinates where float32 costmap arithmetic loses centimetres.
      use_local_cartesian: true
      # Pinned so the map origin is identical every run regardless of spawn.
      # Matches worlds/park.sdf and the park_1.bag dataset.
      wait_for_datum: true
      datum: [49.9, 8.9, 0.0]
      # park has no Magnetometer, so heading comes from IMU orientation.
      magnetic_declination_radians: 0.0
      # 1.5708 (Task 4 fix session 5, controller ruling): IMU yaw is in the
      # world frame, world +x is North after park.sdf's heading_deg: 90, so
      # a north-facing robot has true ENU yaw +pi/2; navsat_transform adds
      # yaw_offset to IMU yaw to get ENU yaw, so this must be +pi/2, not 0.
      # 0.0 looked correct under every self-consistent ENU-vs-ENU check but
      # actually rotated the whole map frame 90 degrees from Gazebo world -
      # exactly the error that would silently misalign maps/park_map.pgm.
      yaw_offset: 1.5708
      use_odometry_yaw: false
      zero_altitude: true
      publish_filtered_gps: true
      broadcast_utm_transform: false
      transform_timeout: 0.1

  ekf_node_map:
    ros__parameters:
      use_sim_time: true
      # 10.0, not 30.0 (controller ruling, Task 4 fix session): map -> odom
      # correction is driven by 1 Hz GPS, so 30 Hz buys nothing and only
      # costs missed deadlines on this machine, which is measurably CPU
      # starved while gz sim runs (load average 13.96, gz sim >100% CPU,
      # this node logging "Failed to meet update rate" at 30 Hz). 10 Hz is
      # still 10x the GPS rate. Do not restore to 30 without re-measuring
      # CPU headroom first.
      frequency: 10.0
      two_d_mode: true               # park is flat to 3.5 mm
      publish_tf: true
      print_diagnostics: true
      map_frame: map
      odom_frame: odom
      base_link_frame: base_link
      world_frame: map               # <- publishes map -> odom

      odom0: platform/odom
      odom0_config: [false, false, false,
                     false, false, false,
                     true,  true,  false,
                     false, false, true,
                     false, false, false]
      odom0_differential: false
      odom0_queue_size: 10

      # imu0 restored (Task 4 fix session 4): dropping it entirely (fix
      # session 3) was a contaminated experiment - it was tried while
      # launch/gps_localization.launch.py still wired navsat_transform_node
      # to the LOCAL filter's odom-frame output, creating a positive
      # feedback loop that manufactured apparent velocity regardless of
      # what was fused here. With that wiring bug fixed, imu0 is back with
      # the round-2 amendment kept: yaw (index 5) and yaw rate (index 11)
      # true, ax (index 12) false. ax stays out - odom0 is velocity-only, so
      # nothing pins absolute x,y between 1 Hz GPS fixes, and
      # double-integrating accelerometer noise over that gap was a real,
      # independent divergence source seen in fix session 1.
      imu0: sensors/imu_0/data
      imu0_config: [false, false, false,
                    false, false, true,
                    false, false, false,
                    false, false, true,
                    false, false, false]
      imu0_differential: false
      imu0_queue_size: 10
      imu0_remove_gravitational_acceleration: true

      odom1: odometry/gps            # from navsat_transform_node
      odom1_config: [true,  true,  false,
                     false, false, false,
                     false, false, false,
                     false, false, false,
                     false, false, false]
      odom1_differential: false
      odom1_queue_size: 10
