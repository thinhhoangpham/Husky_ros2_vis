# Husky A200 - default simulation config.
# Wheel odometry + IMU + 2D/3D lidar. No camera, no compass, no radio.
#
# Wheel odometry needs no sensor entry: the platform's diff-drive controller
# publishes /a200_0000/platform/odom, and the generated EKF (robot_localization)
# fuses it with the IMU into /a200_0000/platform/odom/filtered.
serial_number: a200-0000
version: 0
system:
  hosts:
    - hostname: cpr-a200-0000
      ip: 192.168.131.1
  ros2:
    namespace: a200_0000
platform:
  controller: ps4
  # Shared extras aggregator (urdf/extras_default.urdf.xacro):
  #  - wheel_slip: without it the robot slides sideways off any slope
  #    (0.198 m/m lateral drift vs 0.0045 m/m with this applied).
  #  - imu_enu: world-referenced (ENU) yaw source for the global EKF.
  extras:
    urdf:
      package: null
      path: /home/thinhpham/Documents/Husky_viz/urdf/extras_default.urdf.xacro
  attachments:
    - name: front_bumper
      type: a200.bumper
      parent: front_bumper_mount
    - name: rear_bumper
      type: a200.bumper
      parent: rear_bumper_mount
    - name: top_plate
      type: a200.top_plate
      model: pacs
    - name: sensor_arch
      type: a200.sensor_arch
      parent: default_mount
      model: sensor_arch_300
      enabled: true
mounts:
  bracket:
    - parent: top_plate_mount_d1
      xyz: [0.0, 0.0, 0.0]
      rpy: [0.0, 0.0, 0.0]
      model: horizontal
sensors:
  imu:
    - model: microstrain_imu
      urdf_enabled: true
      launch_enabled: true
      parent: base_link          # axis-aligned, no rotation: verified correct
      xyz: [0.0, 0.0, 0.0]
      rpy: [0.0, 0.0, 0.0]
      ros_parameters:
        microstrain_inertial_driver:
          imu_frame_id: imu_0_link
          port: /dev/microstrain_main
          use_enu_frame: true
  # NOTE: gps_0 is NOT declared here. Clearpath's garmin_18x xacro hardcodes
  # <update_rate>1</update_rate> and exposes no override, so the 2 Hz sensor
  # is a custom xacro instead: urdf/gps_2hz.urdf.xacro, instantiated from
  # urdf/extras_default.urdf.xacro with the same name (gps_0), mount
  # (sensor_arch_mount, xyz 0.0 0.15 0.0) and gz topic. The ROS topic is
  # unchanged: /a200_0000/sensors/gps_0/fix. Custom sensors are not
  # auto-bridged (gotcha #7) - the bridge line is in scripts/run_husky_sim.sh.
  lidar2d:
    - model: hokuyo_ust          # gpu_lidar
      urdf_enabled: true
      launch_enabled: true
      parent: bracket_0_mount
      xyz: [0.0, 0.0, 0.0]
      rpy: [0.0, 0.0, 0.0]
      ros_parameters:
        urg_node:
          laser_frame_id: lidar2d_0_laser
          ip_address: 192.168.131.20
          ip_port: 10940
          # Sweep limited to +-135 deg: the rear sector +-135..180 deg is
          # blocked by the robot's own sensor arch (measured 0.40-0.43 m at
          # +-140 deg, inside the 1.1 x 0.9 m footprint). A full 360 deg sweep
          # makes those self-returns look like a permanent imminent collision
          # to nav2's collision_monitor, which then scales every command to zero.
          angle_min: -2.356194490192345
          angle_max: 2.356194490192345
  lidar3d:
    - model: velodyne_lidar      # gpu_lidar
      urdf_enabled: true
      launch_enabled: true
      parent: sensor_arch_mount
      xyz: [0.0, 0.0, 0.0]
      rpy: [0.0, 0.0, 0.0]
      ros_parameters:
        velodyne_driver_node:
          frame_id: lidar3d_0_laser
          device_ip: 192.168.131.25
          port: 2368
          model: VLP16
        velodyne_transform_node:
          model: VLP16
          fixed_frame: lidar3d_0_laser
          target_frame: lidar3d_0_laser
