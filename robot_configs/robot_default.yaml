# Husky A200 - default simulation config.
# Wheel odometry + IMU + 2D/3D lidar. No camera, no compass, no radio.
#
# Wheel odometry needs no sensor entry: the platform's diff-drive controller
# publishes /a200_0000/platform/odom, and the generated EKF (robot_localization)
# fuses it with the IMU into /a200_0000/platform/odom/filtered.
serial_number: a200-0000
version: 0
system:
  hosts:
    - hostname: cpr-a200-0000
      ip: 192.168.131.1
  ros2:
    namespace: a200_0000
platform:
  controller: ps4
  # Wheel-slip physics override. Without it the robot slides sideways
  # off any slope (0.198 m/m lateral drift vs 0.0045 m/m with this applied).
  extras:
    urdf:
      package: null
      path: /home/thinhpham/Documents/Husky_viz/urdf/wheel_slip.urdf.xacro
  attachments:
    - name: front_bumper
      type: a200.bumper
      parent: front_bumper_mount
    - name: rear_bumper
      type: a200.bumper
      parent: rear_bumper_mount
    - name: top_plate
      type: a200.top_plate
      model: pacs
    - name: sensor_arch
      type: a200.sensor_arch
      parent: default_mount
      model: sensor_arch_300
      enabled: true
mounts:
  bracket:
    - parent: top_plate_mount_d1
      xyz: [0.0, 0.0, 0.0]
      rpy: [0.0, 0.0, 0.0]
      model: horizontal
sensors:
  imu:
    - model: microstrain_imu
      urdf_enabled: true
      launch_enabled: true
      parent: base_link          # axis-aligned, no rotation: verified correct
      xyz: [0.0, 0.0, 0.0]
      rpy: [0.0, 0.0, 0.0]
      ros_parameters:
        microstrain_inertial_driver:
          imu_frame_id: imu_0_link
          port: /dev/microstrain_main
          use_enu_frame: true
  gps:
    - model: garmin_18x          # navsat; needs a world with the NavSat
      urdf_enabled: true         # system + <spherical_coordinates> (all
      launch_enabled: true       # stock Clearpath worlds have both)
      parent: sensor_arch_mount  # high up, offset clear of the 3D lidar
      xyz: [0.0, 0.15, 0.0]
      rpy: [0.0, 0.0, 0.0]
      ros_parameters:
        nmea_navsat_driver:
          frame_id: gps_0_link
          port: /dev/clearpath/gps
          baud: 19200
  lidar2d:
    - model: hokuyo_ust          # gpu_lidar
      urdf_enabled: true
      launch_enabled: true
      parent: bracket_0_mount
      xyz: [0.0, 0.0, 0.0]
      rpy: [0.0, 0.0, 0.0]
      ros_parameters:
        urg_node:
          laser_frame_id: lidar2d_0_laser
          ip_address: 192.168.131.20
          ip_port: 10940
          angle_min: -3.141592653589793
          angle_max: 3.141592653589793
  lidar3d:
    - model: velodyne_lidar      # gpu_lidar
      urdf_enabled: true
      launch_enabled: true
      parent: sensor_arch_mount
      xyz: [0.0, 0.0, 0.0]
      rpy: [0.0, 0.0, 0.0]
      ros_parameters:
        velodyne_driver_node:
          frame_id: lidar3d_0_laser
          device_ip: 192.168.131.25
          port: 2368
          model: VLP16
        velodyne_transform_node:
          model: VLP16
          fixed_frame: lidar3d_0_laser
          target_frame: lidar3d_0_laser
